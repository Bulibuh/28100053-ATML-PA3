[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atml-pa3-task1"
version = "0.1.0"
description = "Reproducible Task 1 experiments for ATML PA3"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.9.1", "transformers==4.57.1", "datasets==3.6.0", "accelerate==1.10.1", "lm_eval==0.4.9", "numpy==2.3.5", "pandas==2.2.3", "PyYAML==6.0.2", "matplotlib==3.10.8", "peft==0.17.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
pa3 = "atml_pa3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
