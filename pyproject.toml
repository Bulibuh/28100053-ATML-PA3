[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atml-pa3"
version = "0.1.0"
description = "Reproducible ATML PA3 experimental pipelines"
requires-python = ">=3.11,<3.14"
dependencies = [
 "torch>=2.8,<2.10", "torchvision>=0.23,<0.25", "transformers==4.57.1", "datasets==3.6.0",
 "accelerate==1.10.1", "numpy>=1.26,<3", "pandas>=2.2,<3",
 "pyarrow>=18,<22", "PyYAML==6.0.2", "Pillow>=10.4,<12",
 "scipy>=1.13,<2", "matplotlib>=3.9,<4", "math-verify==0.8.0",
 "reportlab>=4.2,<5", "lm_eval==0.4.9"
]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
pa3 = "atml_pa3.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
